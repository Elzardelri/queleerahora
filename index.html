<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qué leer ahora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root {
  --paper: #f2f5f1;
  --surface: #ffffff;
  --ink: #1d263d;
  --ink-soft: #4b556e;
  --cobalt: #2c479f;
  --cobalt-soft: #e2e8f7;
  --sage: #557560;
  --sage-soft: #e3ebe4;
  --line: #d3dad2;
  --help-bg: #1d263d;
  --help-ink: #ffffff;
  --note-bg: #f3ecda;
  --note-ink: #574616;
  --serif: 'Literata', Georgia, 'Times New Roman', serif;
  --sans: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141d;
    --surface: #181d29;
    --ink: #e7eaf1;
    --ink-soft: #a7afc2;
    --cobalt: #8ea2ec;
    --cobalt-soft: #212a44;
    --sage: #94b29c;
    --sage-soft: #1d2822;
    --line: #2a3142;
    --help-bg: #e7eaf1;
    --help-ink: #10141d;
    --note-bg: #2a2516;
    --note-ink: #e6d6a2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141d;
  --surface: #181d29;
  --ink: #e7eaf1;
  --ink-soft: #a7afc2;
  --cobalt: #8ea2ec;
  --cobalt-soft: #212a44;
  --sage: #94b29c;
  --sage-soft: #1d2822;
  --line: #2a3142;
  --help-bg: #e7eaf1;
  --help-ink: #10141d;
  --note-bg: #2a2516;
  --note-ink: #e6d6a2;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--paper);
}
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top-row {
  max-width: 36rem;
  margin: 0 auto;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.marca { font-family: var(--serif); font-size: 1.02rem; font-weight: 600; letter-spacing: -0.005em; }
.marca small { display: block; font-family: var(--sans); font-weight: 400; font-size: 0.74rem; color: var(--ink-soft); letter-spacing: 0; }
.ayuda {
  appearance: none;
  border: 0;
  border-radius: 999px;
  background: var(--help-bg);
  color: var(--help-ink);
  font: 700 0.86rem/1 var(--sans);
  padding: 11px 14px;
  min-height: 40px;
  cursor: pointer;
  white-space: nowrap;
}
.progreso { height: 3px; background: transparent; }
.progreso span { display: block; height: 100%; background: var(--cobalt); width: 0; transition: width 0.25s ease; }

main { max-width: 36rem; margin: 0 auto; padding: 28px 18px 56px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
h1 { font-size: 2.05rem; line-height: 1.15; }
h2.pregunta { font-size: 1.42rem; line-height: 1.32; }
h2 { font-size: 1.35rem; line-height: 1.3; }
h3 { font-size: 1.1rem; line-height: 1.35; }
h1:focus, h2:focus { outline: none; }
p { margin: 0 0 14px; }
.lead { font-size: 1.08rem; color: var(--ink-soft); }
.suave { color: var(--ink-soft); }
.chico { font-size: 0.88rem; color: var(--ink-soft); }
.contexto { font-size: 0.92rem; color: var(--ink-soft); margin: 0 0 10px; }
.bloque { margin-top: 26px; }

.opciones { display: grid; gap: 10px; margin-top: 22px; }
.opcion {
  appearance: none;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  min-height: 52px;
  cursor: pointer;
}
.opcion .marcador {
  flex: none;
  width: 20px; height: 20px;
  margin-top: 2px;
  border: 1.5px solid var(--ink-soft);
  border-radius: 50%;
}
.opcion[data-multi] .marcador { border-radius: 5px; }
.opcion[aria-pressed="true"] { border: 2px solid var(--cobalt); background: var(--cobalt-soft); padding: 13px 15px; }
.opcion[aria-pressed="true"] .marcador { border-color: var(--cobalt); background: var(--cobalt); box-shadow: inset 0 0 0 3px var(--cobalt-soft); }
.opcion:disabled { opacity: 0.45; cursor: default; }

.acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 26px; }
.btn {
  appearance: none;
  border: 0;
  border-radius: 12px;
  background: var(--cobalt);
  color: #fff;
  font: 700 1rem/1.2 var(--sans);
  padding: 15px 22px;
  min-height: 50px;
  cursor: pointer;
}
:root[data-theme="dark"] .btn { color: #10141d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #10141d; } }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-sec {
  appearance: none;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 12px;
  font: 700 0.96rem/1.2 var(--sans);
  padding: 13px 18px;
  min-height: 48px;
  cursor: pointer;
}
.link {
  appearance: none;
  background: none;
  border: 0;
  padding: 10px 2px;
  color: var(--cobalt);
  font: 700 0.95rem var(--sans);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.atras { margin-bottom: 14px; padding-top: 0; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

.aviso { background: var(--note-bg); color: var(--note-ink); border-radius: 12px; padding: 14px 16px; margin: 18px 0; font-size: 0.95rem; }
.aviso p:last-child { margin-bottom: 0; }

.linea { border-top: 1px solid var(--line); padding: 14px 0; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.linea:last-child { border-bottom: 1px solid var(--line); }
.linea strong { display: block; }
.linea .chico { margin: 2px 0 0; }
.tel {
  flex: none;
  text-decoration: none;
  background: var(--cobalt-soft);
  color: var(--cobalt);
  font-weight: 700;
  border-radius: 10px;
  padding: 11px 14px;
  white-space: nowrap;
}
.mensaje { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--serif); margin: 10px 0; }

/* Resultado */
.lectura h3 { margin: 22px 0 8px; }
.area-item { margin: 0 0 14px; }
.area-item strong { font-family: var(--serif); font-weight: 600; }
.fichas { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 16px; }
.ficha {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px 14px 14px 6px;
  padding: 18px 18px 16px 64px;
}
.ficha::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50px;
  width: 1.5px;
  background: var(--cobalt);
  opacity: 0.55;
}
.ficha .num {
  position: absolute;
  left: 0; top: 14px;
  width: 50px;
  text-align: center;
  font-family: var(--serif);
  font-size: 1.9rem;
  line-height: 1;
  color: var(--cobalt);
}
.ficha .titulo { font-family: var(--serif); font-size: 1.16rem; font-weight: 600; line-height: 1.3; margin: 0; }
.ficha .autor { margin: 2px 0 10px; color: var(--ink-soft); }
.etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
.etiquetas li { font-size: 0.8rem; border-radius: 999px; padding: 3px 10px; background: var(--sage-soft); color: var(--sage); font-weight: 700; }
.etiquetas li.ahora { background: var(--cobalt-soft); color: var(--cobalt); }
.etiquetas li.despues { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
.ficha p { font-size: 0.97rem; margin: 0 0 8px; }
.ficha .porque { margin-top: 6px; }
.ficha .cuidado { font-size: 0.9rem; color: var(--ink-soft); }
.despues-sep { font-family: var(--serif); font-size: 1rem; color: var(--ink-soft); margin: 10px 0 -4px; }

details.calculo { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 14px; }
details.calculo summary { cursor: pointer; color: var(--cobalt); font-weight: 700; }
details.calculo table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.88rem; }
details.calculo td, details.calculo th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla-scroll { overflow-x: auto; }

.hoja-fondo { position: fixed; inset: 0; background: rgba(10, 14, 22, 0.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.hoja {
  background: var(--paper);
  width: 100%;
  max-width: 36rem;
  max-height: 88vh;
  overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px));
}
.hoja-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

@media (prefers-reduced-motion: no-preference) {
  .revela .ficha { animation: entra 0.5s ease both; }
  .revela .ficha:nth-child(2) { animation-delay: 0.08s; }
  .revela .ficha:nth-child(3) { animation-delay: 0.16s; }
  .revela .ficha:nth-child(4) { animation-delay: 0.24s; }
  .revela .ficha:nth-child(5) { animation-delay: 0.32s; }
  .revela .ficha:nth-child(6) { animation-delay: 0.4s; }
  .revela .ficha:nth-child(7) { animation-delay: 0.48s; }
}
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ===== v2 ===== */
:root { --rosa-bg: #fde6f0; --rosa: #b0185a; --rosa-ink: #7d1242; --papel: #fbfcfa; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rosa-bg: #3a1629; --rosa: #f48cba; --rosa-ink: #f9c4dc; --papel: #171c27; } }
:root[data-theme="dark"] { --rosa-bg: #3a1629; --rosa: #f48cba; --rosa-ink: #f9c4dc; --papel: #171c27; }

.nota-rosa { background: var(--rosa-bg); color: var(--rosa-ink); border-radius: 12px; padding: 12px 16px; margin: 16px 0; font-size: 0.95rem; }
.nota-rosa p { margin: 0; }
.nota-rosa p + p { margin-top: 8px; }

.estante { display: block; width: 100%; height: auto; margin: 4px 0 22px; }
.capitulo .num-cap { font-family: var(--serif); color: var(--cobalt); font-size: 1rem; margin: 0 0 6px; }
.capitulo h1 { font-size: 2.2rem; }
.capitulo .frase { font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; color: var(--ink-soft); margin-top: 14px; }

.pagina { background: var(--papel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px 22px; position: relative; }
.cinta { position: absolute; top: -1px; right: 22px; width: 18px; height: 34px; background: var(--rosa); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.donde { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 8px; }

/* deslizador */
.termo { margin-top: 26px; }
.termo-valor { font-family: var(--serif); font-size: 3rem; line-height: 1; color: var(--cobalt); text-align: center; margin-bottom: 10px; }
.termo input[type=range] { width: 100%; height: 44px; accent-color: var(--cobalt); }
.termo-ext { display: flex; justify-content: space-between; gap: 16px; font-size: 0.9rem; color: var(--ink-soft); }
.termo-ext span:last-child { text-align: right; }

/* balanza */
.frase-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--serif); font-size: 1.04rem; line-height: 1.45; }
.balanza { display: grid; gap: 10px; margin-top: 20px; }
.escala { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.escala button { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; min-height: 64px; padding: 8px 4px; font: 700 0.8rem/1.2 var(--sans); cursor: pointer; }
.escala button[aria-pressed="true"] { border: 2px solid var(--cobalt); background: var(--cobalt-soft); color: var(--cobalt); }
.escala-guia { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--ink-soft); }

/* transición */
.transicion { text-align: center; padding-top: 10px; }
.transicion svg { width: 100%; max-width: 360px; height: auto; margin: 0 auto 18px; display: block; }
.transicion .linea-t { font-family: var(--serif); font-size: 1.1rem; color: var(--ink-soft); min-height: 1.6em; }
@media (prefers-reduced-motion: no-preference) {
  .main-anim { animation: hoja 0.28s ease both; }
  .cae { animation: cae 0.5s cubic-bezier(.2,.8,.3,1.2) both; }
  .luz { animation: luz 1.6s ease-in-out infinite alternate; }
}
@keyframes hoja { from { opacity: 0.2; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes cae { from { transform: translateY(-120px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes luz { from { opacity: 0.35; } to { opacity: 0.85; } }

.hero { margin-bottom: 8px; }
.leido { appearance: none; background: none; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; font: 700 0.82rem var(--sans); padding: 8px 12px; cursor: pointer; margin-top: 4px; }
.beneficios { margin-top: 30px; }
.beneficio { border-left: 3px solid var(--sage); padding: 2px 0 2px 14px; margin: 16px 0; }
.beneficio h3 { font-size: 1.02rem; margin-bottom: 4px; }
.beneficio p { margin: 0 0 4px; font-size: 0.96rem; }
.beneficio .fuente { font-size: 0.82rem; color: var(--ink-soft); }
.meta-lectura { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; background: var(--sage-soft); border-radius: 12px; padding: 14px 16px; margin-top: 18px; }

/* ===== Escena animada de biblioteca ===== */
.escena { position: relative; height: 360vh; margin: -12px 0 0; }
.escenario {
  --a: 0; --b: 0; --c: 0; --p: 0;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px);
  height: calc(100vh - 86px - env(safe-area-inset-top, 0px)); min-height: 460px;
  overflow: hidden; border-radius: 20px; color: #f3f1ea; isolation: isolate;
}
.escenario.compacta { position: relative; top: 0; height: 330px; min-height: 0; }
.escenario.estatica { position: relative; top: 0; height: 560px; }
.cielo, .calido { position: absolute; inset: 0; z-index: -2; }
.cielo { background: radial-gradient(120% 80% at 50% 0%, #26336a 0%, #121a36 55%, #0b1024 100%); }
.calido { background: radial-gradient(110% 75% at 50% 38%, #6b3b2a 0%, #3a2238 45%, #141a33 100%); opacity: var(--a); }
.letra { position: absolute; font-family: var(--serif); color: rgba(240, 236, 255, 0.55); opacity: calc(0.85 - var(--a) * 0.5); will-change: transform; }
.resplandor { position: absolute; left: 50%; top: 36%; width: 340px; height: 340px; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, rgba(255, 214, 140, 0.85) 0%, rgba(255, 190, 110, 0.25) 40%, transparent 68%);
  transform: translate(-50%, -50%) scale(calc(0.5 + var(--a) * 0.8)); opacity: calc(0.15 + var(--a) * 0.85); }
.libro-wrap { position: absolute; left: 50%; top: 36%; width: 132px; height: 180px; transform: translate(-50%, -50%); perspective: 900px; }
.compacta .libro-wrap { width: 96px; height: 130px; }
.libro { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(10deg) rotateZ(calc((1 - var(--a)) * -5deg)) translateX(calc(var(--a) * 34%)); }
.contratapa { position: absolute; inset: 0; background: #7d1242; border-radius: 3px 10px 10px 3px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
.hoja { position: absolute; inset: 5px 6px 5px 0; background: linear-gradient(90deg, #e9e1cc, #fbf7ec 30%); border-radius: 0 6px 6px 0; transform-origin: left center; transform: rotateY(calc(var(--a) * var(--giro))); }
.tapa { position: absolute; inset: 0; background: linear-gradient(135deg, #c2266b, #8e1450); border-radius: 3px 10px 10px 3px; transform-origin: left center; transform: rotateY(calc(var(--a) * -168deg)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: inset 6px 0 0 rgba(0, 0, 0, 0.18); }
.tapa-linea { width: 56%; height: 2px; background: rgba(255, 233, 196, 0.8); }
.tapa-signo { font-family: var(--serif); font-size: 2rem; color: #ffe9c4; }
.repisa { position: absolute; left: 8%; right: 8%; top: 80%; height: 7px; border-radius: 3px; background: rgba(255, 233, 196, 0.75); opacity: var(--b); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35); }
.vuela { position: absolute; left: 50%; top: 36%; border-radius: 2px; opacity: 0; box-shadow: inset -3px 0 0 rgba(0, 0, 0, 0.18), inset 0 8px 0 rgba(255, 255, 255, 0.18); will-change: transform, opacity; }
.rotulo { position: absolute; left: 6%; right: 6%; top: 7%; margin: 0; text-align: center; font-family: var(--serif); font-size: 1.28rem; line-height: 1.4; color: #fbf6ea; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
.final { position: absolute; left: 0; right: 0; top: 5%; padding: 0 22px; text-align: center; opacity: var(--c); transform: translateY(calc((1 - var(--c)) * 18px)); }
.final h1 { color: #fffaf0; font-size: 2.2rem; }
.final p { color: #f1e9da; margin: 10px auto 0; max-width: 26rem; }
.final .btn { margin-top: 16px; background: #f4c97a; color: #1d1830; }
.desliza { position: absolute; left: 0; right: 0; bottom: 4%; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.88rem; color: #e9e3f5; }
@media (prefers-reduced-motion: no-preference) { .desliza svg { animation: brinca 1.4s ease-in-out infinite; } }
@keyframes brinca { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
.prisa { display: flex; justify-content: flex-end; margin: -10px 0 6px; }

/* pasar de página entre preguntas */
@media (prefers-reduced-motion: no-preference) {
  .main-anim { animation: pagina 0.36s cubic-bezier(.2,.7,.3,1) both; transform-origin: left center; }
}
@keyframes pagina { from { opacity: 0.15; transform: perspective(900px) rotateY(-16deg) translateX(14px); } to { opacity: 1; transform: none; } }

/* ===== Portada limpia y sin encimarse ===== */
.portada .top { display: none; }
.portada main { padding-top: 8px; }
.portada .escenario { top: calc(env(safe-area-inset-top, 0px) + 8px); height: calc(100vh - 16px - env(safe-area-inset-top, 0px)); }
.libro-wrap, .vuela { top: 30%; }
.resplandor { top: 30%; width: 300px; height: 300px; opacity: calc((0.15 + var(--a) * 0.85) * (1 - var(--c) * 0.45)); }
.repisa { top: 60%; }
.final { top: auto; bottom: 5%; }
.final h1 { font-size: 2rem; }

/* ===== Escena 3D ===== */
.escena-larga { height: 420vh; }
.lienzo-3d { position: absolute; inset: 0; z-index: 0; }
.lienzo-3d canvas { display: block; width: 100%; height: 100%; }
.escenario-3d .rotulo, .escenario-3d .final, .escenario-3d .desliza { z-index: 2; }
.escenario-3d .final { opacity: 0; }

/* ===== Portada pop-up: paleta rosa, lila y durazno ===== */
.escenario-rosa .cielo, .escenario:not(.escenario-3d) .cielo {
  background: radial-gradient(120% 85% at 50% 8%, #fff6ef 0%, #fbe0e8 32%, #ecd6f5 62%, #cdbcf0 100%);
}
.escenario:not(.escenario-3d) .calido { background: radial-gradient(110% 70% at 50% 32%, #ffe3cf 0%, #f7cfe0 45%, rgba(205,188,240,0) 100%); }
.escenario-rosa, .escenario:not(.escenario-3d) { color: #4a2246; }
.escenario-rosa .rotulo, .escenario:not(.escenario-3d) .rotulo { color: #4a2246; text-shadow: 0 1px 10px rgba(255, 245, 240, 0.9); }
.escenario:not(.escenario-3d) .letra { color: rgba(122, 64, 112, 0.45); }

/* ===== Una sola identidad: la del amanecer de la portada en toda la app ===== */

    --help-bg: #f7e9f1; --help-ink: #1d1424;

  --paper: #1d1424; --surface: #2a1d31; --papel: #2a1d31;

body { background: var(--fondo); background-color: var(--paper); background-attachment: fixed; min-height: 100vh; }

/* la portada también en modo oscuro: un atardecer ciruela */

  :root:not([data-theme="light"]) .escenario-rosa .rotulo, :root:not([data-theme="light"]) .escenario-rosa .final h1, :root:not([data-theme="light"]) .escenario-rosa .final p, :root:not([data-theme="light"]) .escenario-rosa .desliza { color: #fbe9f2; text-shadow: 0 1px 10px rgba(29, 20, 36, 0.8); }
}

/* ===== Flecha para invitar a bajar ===== */
.desliza { gap: 8px; }
.desliza .flecha { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255, 250, 248, 0.78); color: #b8457a; box-shadow: 0 6px 18px rgba(184, 69, 122, 0.25), inset 0 0 0 1.5px rgba(184, 69, 122, 0.35); }
.desliza .pista-texto { font-family: var(--serif); font-size: 0.98rem; letter-spacing: 0.01em; }
@media (prefers-reduced-motion: no-preference) { .desliza .flecha { animation: invita 1.8s ease-in-out infinite; } }
@keyframes invita { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .desliza .flecha { background: rgba(42, 29, 49, 0.8); color: #f290ba; } }


/* ===== Portada moderna a pantalla completa ===== */
.portada .escena { margin: 0; }
.portada main { padding: 0; max-width: none; }
.portada .escenario { top: 0; height: 100vh; height: 100svh; border-radius: 0; }
.escenario-moderno .rotulo { top: 9%; font-size: 1.32rem; }
/* Flecha para bajar, bien visible */
.escenario .desliza { bottom: calc(5% + env(safe-area-inset-bottom, 0px)); gap: 12px; z-index: 3; }
.desliza .flecha { position: relative; width: 64px; height: 64px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: #b8457a; color: #fff; box-shadow: 0 12px 28px rgba(184, 69, 122, 0.45); }
.desliza .flecha::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid rgba(184, 69, 122, 0.6); opacity: 0; }
.desliza .pista-texto { background: rgba(255, 250, 248, 0.94); color: #4a2246; font-family: var(--sans); font-weight: 700; font-size: 0.98rem;
  padding: 8px 16px; border-radius: 999px; box-shadow: 0 6px 16px rgba(90, 42, 82, 0.14); text-shadow: none; }
@media (prefers-reduced-motion: no-preference) {
  .desliza .flecha { animation: invita 1.6s ease-in-out infinite; }
  .desliza .flecha::after { animation: onda 1.6s ease-out infinite; }
}
@keyframes invita { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
@keyframes onda { from { transform: scale(0.85); opacity: 0.9; } to { transform: scale(1.5); opacity: 0; } }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .desliza .flecha { background: #e2649c; color: #fff; }
  :root:not([data-theme="light"]) .desliza .pista-texto { background: rgba(255, 245, 250, 0.95); color: #4a2246; text-shadow: none; }
}

/* ===== Portada: ceja de marca y titular ===== */
.escenario-rosa .final p.ceja { font-family: var(--sans); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #b8457a; margin: 0 auto 8px; }
.escenario-rosa .final h1 { font-size: 1.9rem; line-height: 1.18; max-width: 20rem; margin: 0 auto; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .escenario-rosa .final p.ceja { color: #f6a9c8; } }

<body>
<header class="top">
  <div class="top-row">
    <div class="marca">Qué leer ahora</div>
  </div>
  <div class="progreso" aria-hidden="true"><span id="barra"></span></div>
</header>
<main id="main" aria-live="polite"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
// ===== Datos: biblioteca, preguntas y plantillas (según el documento de diseño) =====
// tipo: N narrativa · L poesía y ensayo literario · D divulgación · P práctico
// f: E estabilizar · C comprender · K construir · P profundizar
// nv: 1 introductorio · 2 intermedio · 3 avanzado
function bk(n, t, a, tipo, ar, f, nv, pp, ay, cu, o) {
  o = o || {};
  return { n: n, t: t, a: a, tipo: tipo, ar: ar, f: f, nv: nv, pp: pp, ay: ay, cu: cu, hi: !!o.hi, ed: o.ed || 3 };
}

var BOOKS = [
  bk(1, 'La trampa de la felicidad', 'Russ Harris', 'P', ['ANS','MIE'], 'E', 1, 250, 'dejar de pelear contra pensamientos y emociones difíciles y actuar según lo que te importa', 'No promete eliminar la ansiedad: enseña a convivir con ella.', { ed: 1 }),
  bk(2, 'Mindfulness en la vida cotidiana', 'Jon Kabat-Zinn', 'P', ['ANS','HAB'], 'E', 1, 272, 'estar más presente y bajar el ruido mental con prácticas sencillas', 'Si la ansiedad es muy intensa o hay trauma, la meditación puede inquietar más: mejor con acompañamiento.'),
  bk(3, 'Cuando todo se derrumba', 'Pema Chödrön', 'D', ['RUP','ANS','MIE'], 'E', 1, 190, 'sostenerte cuando algo se rompe, sin buscar soluciones inmediatas', 'Tiene un marco budista y no da pasos prácticos.'),
  bk(4, 'El poder del ahora', 'Eckhart Tolle', 'D', ['ANS','SEN'], 'E', 1, 220, 'soltar la rumiación sobre el pasado y el futuro', 'Su tono es espiritual y puede sentirse abstracto en plena ansiedad.', { ed: 2 }),
  bk(5, 'Los cuatro acuerdos', 'Miguel Ruiz', 'P', ['REL','MIE','HER'], 'E', 1, 150, 'no tomarte todo como algo personal y cuidar lo que dices', 'Es muy esquemático; si otros te hicieron daño, puede sonar a «todo depende de ti».'),
  bk(6, 'Los dones de la imperfección', 'Brené Brown', 'D', ['MIE','HER'], 'C', 1, 190, 'soltar la exigencia de perfección y la vergüenza que paraliza', 'Mezcla investigación y reflexión personal; no da pasos concretos.'),
  bk(7, 'Sé amable contigo mismo', 'Kristin Neff', 'P', ['HER','MIE','RUP'], 'C', 1, 336, 'tratarte con comprensión en lugar de autocrítica', 'Es más largo de lo que parece; si hay trauma, haz los ejercicios con acompañamiento.'),
  bk(8, 'Sobre el duelo y el dolor', 'Elisabeth Kübler-Ross y David Kessler', 'D', ['RUP'], 'C', 1, 280, 'entender el duelo y sus vaivenes después de una pérdida', 'Puede ser muy intenso si la pérdida es de hace pocas semanas; las «etapas» no son una lista que se cumple en orden.'),
  bk(9, 'El año del pensamiento mágico', 'Joan Didion', 'L', ['RUP'], 'C', 2, 220, 'acompañarte con un relato honesto sobre el duelo', 'Narra la muerte de su pareja y no da consejos.', { hi: true }),
  bk(10, 'Maneras de amar', 'Amir Levine y Rachel Heller', 'D', ['REL','RUP'], 'C', 1, 256, 'entender cómo tu estilo de apego influye en tus vínculos', 'Usa los estilos de apego como hipótesis, no como etiqueta, sobre todo en plena ruptura.'),
  bk(11, 'El arte de amar', 'Erich Fromm', 'D', ['REL'], 'C', 2, 150, 'ver el amor como una práctica que se aprende', 'Es denso, de 1956, y no da pasos prácticos.'),
  bk(12, 'Los 5 lenguajes del amor', 'Gary Chapman', 'P', ['REL'], 'C', 1, 200, 'conversar sobre cómo cada quien da y recibe cariño', 'Su respaldo científico es limitado; no sirve para «arreglar» a la pareja ni en relaciones con maltrato.'),
  bk(13, 'Reinventa tu vida', 'Jeffrey Young y Janet Klosko', 'P', ['HER','REL'], 'C', 2, 350, 'reconocer patrones que se repiten en tus relaciones', 'Puede remover recuerdos; mejor con acompañamiento.', { hi: true }),
  bk(14, 'El hombre en busca de sentido', 'Viktor Frankl', 'L', ['SEN','CRI'], 'C', 2, 160, 'encontrar sentido en medio del sufrimiento y de los límites', 'La primera parte narra la vida en campos de concentración.', { hi: true, ed: 1 }),
  bk(15, 'Ikigai', 'Héctor García y Francesc Miralles', 'D', ['SEN','PRO'], 'C', 1, 190, 'explorar qué te da energía y razón de ser en lo cotidiano', 'Es divulgativo y simplificado.'),
  bk(16, 'El alquimista', 'Paulo Coelho', 'N', ['SEN'], 'C', 1, 200, 'reconectar con la idea de buscar un camino propio', 'El mensaje es simple; no da herramientas.'),
  bk(17, 'El monje que vendió su Ferrari', 'Robin Sharma', 'N', ['SEN','HAB'], 'C', 1, 230, 'replantear prioridades y rutinas desde una historia', 'Tiene tono de gurú y sus ideas son generales.'),
  bk(18, 'Empieza por el porqué', 'Simon Sinek', 'D', ['SEN','PRO','LID'], 'C', 2, 260, 'entender para qué haces lo que haces y comunicarlo', 'Su marco es de negocios más que personal.'),
  bk(19, 'Mindset', 'Carol Dweck', 'D', ['PRO','BLO','MIE'], 'C', 1, 300, 'ver cómo creer que se puede aprender cambia tu forma de enfrentar errores y retos', 'Si te culpas con facilidad, puede leerse como «si no avanzas es tu actitud».', { ed: 2 }),
  bk(20, '¿Quién se ha llevado mi queso?', 'Spencer Johnson', 'N', ['PRO','MIE'], 'C', 1, 100, 'enfrentar un cambio sin quedarte paralizado', 'Ignora causas que no dependen de ti, como despidos o abusos laborales.'),
  bk(21, 'Atrévete a no gustar', 'Ichiro Kishimi y Fumitake Koga', 'D', ['MIE','REL','SEN'], 'C', 2, 272, 'soltar la necesidad de aprobación ajena', 'Si arrastras heridas del pasado, su idea de que el pasado no te determina puede sentirse invalidante.'),
  bk(22, 'Inteligencia emocional', 'Daniel Goleman', 'D', ['REL','LID'], 'C', 2, 420, 'entender cómo las emociones influyen en decisiones y relaciones', 'Es largo y algunas de sus afirmaciones se han matizado desde 1995.'),
  bk(23, 'Los líderes comen al final', 'Simon Sinek', 'D', ['LID'], 'C', 2, 350, 'crear equipos donde la gente se siente segura y confía', 'Usa analogías biológicas muy simplificadas.'),
  bk(24, 'El líder que no tenía cargo', 'Robin Sharma', 'N', ['LID'], 'C', 1, 200, 'ejercer influencia sin autoridad formal', 'Tiene un tono muy motivacional.'),
  bk(25, 'Libera tu magia', 'Elizabeth Gilbert', 'D', ['BLO','MIE'], 'C', 1, 310, 'vivir la creatividad con menos miedo y más curiosidad', 'Es más inspirador que práctico.', { ed: 1 }),
  bk(26, 'Cartas a un joven poeta', 'Rainer Maria Rilke', 'L', ['BLO','SEN'], 'C', 1, 100, 'acompañarte cuando dudas de si vale la pena crear', 'Es poético y abstracto.'),
  bk(27, 'Cómo hacer que te pasen cosas buenas', 'Marian Rojas Estapé', 'D', ['ANS','HAB'], 'C', 1, 300, 'entender cómo el estrés afecta al cuerpo y qué hábitos ayudan', 'Simplifica temas de neurociencia y no sustituye una terapia.'),
  bk(28, 'Hábitos atómicos', 'James Clear', 'P', ['HAB','BLO','PRO'], 'K', 1, 330, 'armar hábitos pequeños y sostenibles', 'Sin energía o en crisis, puede sentirse como una exigencia más.'),
  bk(29, 'El poder de los hábitos', 'Charles Duhigg', 'D', ['HAB'], 'K', 1, 400, 'entender cómo se forman y cambian los hábitos', 'Es extenso y anecdótico.'),
  bk(30, 'Esencialismo', 'Greg McKeown', 'P', ['HAB','PRO','LID'], 'K', 2, 270, 'priorizar y decir que no cuando todo parece urgente', 'Si no controlas tu agenda, puede frustrar.'),
  bk(31, 'Organízate con eficacia', 'David Allen', 'P', ['HAB','PRO'], 'K', 2, 352, 'vaciar la cabeza de pendientes con un sistema', 'Exige montar un sistema completo.'),
  bk(32, 'Los 7 hábitos de la gente altamente efectiva', 'Stephen Covey', 'P', ['HAB','PRO','LID'], 'K', 2, 450, 'ordenar prioridades y relaciones desde principios', 'Es largo, corporativo y algo anticuado.'),
  bk(33, 'Design de vida', 'Bill Burnett y Dave Evans', 'P', ['SEN','PRO','CRI'], 'K', 1, 320, 'explorar caminos con experimentos pequeños en lugar de decidir a ciegas', 'Algunos ejercicios suponen margen para experimentar, y puede costar conseguirlo en México.'),
  bk(34, 'El obstáculo es el camino', 'Ryan Holiday', 'P', ['MIE','PRO','ANS'], 'K', 1, 220, 'usar las dificultades como material de trabajo', 'En un duelo, «todo obstáculo es una oportunidad» puede sonar frío.'),
  bk(35, 'El gerente al minuto', 'Kenneth Blanchard y Spencer Johnson', 'N', ['LID'], 'K', 1, 120, 'fijar metas, reconocer y corregir con claridad', 'Es muy simplificado para equipos complejos.'),
  bk(36, 'Comunicación no violenta', 'Marshall Rosenberg', 'P', ['REL','LID'], 'K', 2, 230, 'expresar lo que necesitas y escuchar sin acusar', 'Sus fórmulas pueden sonar artificiales; no es para situaciones de abuso.'),
  bk(37, 'Conversaciones cruciales', 'Kerry Patterson y otros', 'P', ['REL','LID'], 'K', 2, 330, 'hablar de temas difíciles sin evitarlos ni explotar', 'Es largo y de tono corporativo.'),
  bk(38, 'Cómo ganar amigos e influir sobre las personas', 'Dale Carnegie', 'P', ['REL','LID'], 'K', 1, 280, 'aplicar reglas sencillas de trato con los demás', 'Sus ejemplos son de otra época.'),
  bk(39, 'El camino del artista', 'Julia Cameron', 'P', ['BLO','HER'], 'K', 2, 280, 'retomar la creatividad con prácticas diarias', 'Pide tiempo cada día y usa lenguaje espiritual.'),
  bk(40, 'Roba como un artista', 'Austin Kleon', 'P', ['BLO'], 'K', 1, 150, 'empezar a crear sin esperar una originalidad perfecta', 'Es muy breve; no es un método detallado.', { ed: 1 }),
  bk(41, 'La guerra del arte', 'Steven Pressfield', 'P', ['BLO'], 'K', 1, 200, 'reconocer la «resistencia» que te frena al empezar', 'Su tono duro puede aumentar la autoexigencia.'),
  bk(42, 'Atrévete a ser líder', 'Brené Brown', 'P', ['LID','MIE'], 'K', 2, 350, 'liderar con valentía en conversaciones difíciles y al dar feedback', 'No es un manual técnico de gestión.'),
  bk(43, 'Sentirse bien', 'David Burns', 'P', ['ANS','HAB'], 'K', 2, 650, 'reconocer pensamientos que empeoran el ánimo y trabajar con ellos', 'Es muy largo y no sustituye atención profesional.'),
  bk(44, 'Sal de tu mente, entra en tu vida', 'Steven Hayes', 'P', ['ANS','MIE'], 'K', 3, 410, 'desarrollar flexibilidad psicológica con ejercicios', 'Es denso; rinde más después de La trampa de la felicidad.'),
  bk(45, '¿Por qué las cebras no tienen úlcera?', 'Robert Sapolsky', 'D', ['ANS','HAB'], 'P', 3, 500, 'entender cómo funciona el estrés en el cuerpo', 'Es largo y técnico; en plena ansiedad puede aumentar la hipervigilancia.'),
  bk(46, 'Meditaciones', 'Marco Aurelio', 'D', ['SEN','CRI','MIE','ANS'], 'P', 2, 250, 'distinguir lo que puedes y lo que no puedes controlar', 'Es denso y fragmentario; elige una edición con introducción.'),
  bk(47, 'El cuerpo lleva la cuenta', 'Bessel van der Kolk', 'D', ['HER'], 'P', 3, 500, 'entender cómo el trauma se vive en el cuerpo', 'Puede ser muy removedor; mejor con acompañamiento profesional.', { hi: true }),
  bk(48, 'Mujeres que corren con los lobos', 'Clarissa Pinkola Estés', 'L', ['HER','BLO'], 'P', 3, 500, 'recuperar la intuición y la creatividad a través de relatos', 'Es largo y simbólico.'),
  bk(49, 'Fluir', 'Mihaly Csikszentmihalyi', 'D', ['SEN','BLO'], 'P', 3, 400, 'entender cuándo estamos plenamente absortos en algo', 'Es teórico y académico.'),
  bk(50, 'El desafío del liderazgo', 'James Kouzes y Barry Posner', 'D', ['LID'], 'P', 3, 400, 'conocer prácticas de liderazgo basadas en investigación', 'Es denso y pensado para quien ya dirige.'),
  bk(51, 'El principito', 'Antoine de Saint-Exupéry', 'N', ['REL','SEN'], 'E', 1, 100, 'mirar con calma lo que importa en los vínculos y en la vida', 'Es breve y simbólico.'),
  bk(52, 'Siddhartha', 'Hermann Hesse', 'N', ['SEN','CRI'], 'C', 2, 150, 'acompañar una búsqueda de sentido que pasa por el error y el cambio', 'Incluye un pasaje de desesperación.', { hi: true }),
  bk(53, 'El viejo y el mar', 'Ernest Hemingway', 'N', ['MIE','SEN'], 'C', 1, 110, 'perseverar y mantener la dignidad frente a la derrota', 'El final es agridulce.'),
  bk(54, 'Como agua para chocolate', 'Laura Esquivel', 'N', ['REL','HER'], 'C', 1, 220, 'mirar emociones guardadas, familia y amor contados desde la cocina', 'Hay una madre autoritaria y un final trágico.'),
  bk(55, 'Las batallas en el desierto', 'José Emilio Pacheco', 'N', ['RUP','HER'], 'C', 1, 70, 'recorrer la nostalgia, el primer amor y la pérdida en la Ciudad de México', 'Tiene un tono triste; evítalo con un duelo muy reciente.'),
  bk(56, 'La casa en Mango Street', 'Sandra Cisneros', 'N', ['SEN','HER'], 'C', 1, 130, 'pensar la identidad y el deseo de un lugar propio, en viñetas cortas', 'Algunas viñetas tratan violencia.', { hi: true }),
  bk(57, 'El libro de los abrazos', 'Eduardo Galeano', 'N', ['REL','SEN'], 'C', 1, 130, 'leer textos de una o dos páginas, poco y seguido', 'No tiene una trama continua.'),
  bk(58, 'Veinte poemas de amor y una canción desesperada', 'Pablo Neruda', 'L', ['RUP','REL'], 'C', 1, 90, 'ponerle palabras al amor y al desamor', 'Con una ruptura reciente, la «canción desesperada» no consuela.', { hi: true }),
  bk(59, 'Un cuarto propio', 'Virginia Woolf', 'L', ['BLO','SEN'], 'C', 2, 130, 'ver cómo el tiempo, el espacio y el dinero condicionan la creación', 'Es de 1929 y no trae ejercicios.'),
  bk(60, 'Mientras escribo', 'Stephen King', 'P', ['BLO'], 'K', 1, 320, 'trabajar la escritura con disciplina', 'Incluye pasajes sobre su adicción y un accidente grave.'),

    document.body.classList.toggle('portada', p === 'welcome');
    if (p === 'welcome') nodos = pantallaInicio();
    else if (p === 'examples') nodos = pantallaEjemplos();
    else if (p.indexOf('cap:') === 0) nodos = pantallaCapitulo(p.slice(4));
    else if (Q_A[p]) nodos = pantallaA(p);
    else if (Q_B[p]) nodos = pantallaB(p);
    else if (p === 'C0') nodos = pantallaC0();
    else if (p === 'special') nodos = pantallaEspecial();
    else if (p === 'acomp') nodos = pantallaAcomp();
    else if (p === 'F1') nodos = multiple('F1', Q_F1, CAPITULOS.cierre.t);
    else if (p === 'F2') nodos = multiple('F2', Q_F2, CAPITULOS.cierre.t);
    else if (p.indexOf('offer:') === 0) nodos = pantallaOferta(p.slice(6));
    else if (p === 'transicion') nodos = pantallaTransicion();
    else if (p === 'result') nodos = pantallaResultado();
    else nodos = pantallaArea(p);
    main.innerHTML = '';
    nodos.forEach(function (n) { if (n) main.appendChild(n); });
    main.classList.remove('main-anim');
    if (!quieto && !reducido && p !== 'welcome') { void main.offsetWidth; main.classList.add('main-anim'); }
    progreso();
    if (!quieto) {
      try { window.scrollTo(0, 0); } catch (e) {}
      var foco = main.querySelector('h1, h2');
      if (foco) foco.focus({ preventScroll: true });
    }
  }
  render();
})();

</script>
</body>
</html>
